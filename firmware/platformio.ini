; PlatformIO project for the WaterFlex Plan C salt sensor.
; Board: Arduino Nano ESP32 (ESP32-S3 / NORA-W106).
;
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor

[env:arduino_nano_esp32]
platform = espressif32
board = arduino_nano_esp32
framework = arduino
monitor_speed = 115200
upload_protocol = esptool
build_flags =
	-DWATERFLEX_ALLOW_DEVELOPMENT_PROVISIONING=0
lib_deps =
	bblanchon/ArduinoJson @ ^7.4.2

[env:arduino_nano_esp32_development]
extends = env:arduino_nano_esp32
build_flags =
	-DWATERFLEX_ALLOW_DEVELOPMENT_PROVISIONING=1

[env:arduino_nano_esp32_factory_production]
extends = env:arduino_nano_esp32
build_flags =
	-DWATERFLEX_ALLOW_DEVELOPMENT_PROVISIONING=0
	-DWATERFLEX_TELEMETRY_URL=\"https://telemetry.saltmonitor.dev/api/v1/device/telemetry\"
