services:
  api:
    image: ${API_IMAGE:?Set API_IMAGE to an ECR repository digest}
    pull_policy: always
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ConnectionStrings__SaltMonitor: ${ConnectionStrings__SaltMonitor:-}
      CloudflareAccess__Issuer: ${CloudflareAccess__Issuer:?Set CloudflareAccess__Issuer}
      CloudflareAccess__Audience: ${CloudflareAccess__Audience:?Set CloudflareAccess__Audience}
      Logging__LogLevel__Default: Information
    volumes:
      - /etc/ssl/certs/aws-rds-global-bundle.pem:/etc/ssl/certs/aws-rds-global-bundle.pem:ro
    expose:
      - "8080"
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health/live"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 4

  worker:
    image: ${WORKER_IMAGE:?Set WORKER_IMAGE to an ECR repository digest}
    pull_policy: always
    environment:
      DOTNET_ENVIRONMENT: Staging
      ConnectionStrings__SaltMonitor: ${ConnectionStrings__SaltMonitor:-}
      TelemetryHistory__RawRetentionDays: 30
      TelemetryHistory__HourlyRetentionMonths: 13
      TelemetryHistory__DailyRetentionYears: 3
      TelemetryHistory__DeleteBatchSize: 10000
      TelemetryHistory__MaintenanceIntervalMinutes: 15
      AWS_REGION: ${AWS_REGION:-us-east-2}
      StaffProvisioning__Enabled: ${StaffProvisioning__Enabled:-false}
      StaffProvisioning__CognitoUserPoolId: ${StaffProvisioning__CognitoUserPoolId:-}
      StaffProvisioning__CloudflareAccountId: ${StaffProvisioning__CloudflareAccountId:-}
      StaffProvisioning__CloudflareApiToken: ${StaffProvisioning__CloudflareApiToken:-}
      StaffProvisioning__CloudflareSecretId: ${StaffProvisioning__CloudflareSecretId:-waterflex/staging/staff-provisioning}
      StaffProvisioning__CloudflarePrivilegedGroupId: ${StaffProvisioning__CloudflarePrivilegedGroupId:-}
      StaffProvisioning__CloudflareDealerGroupId: ${StaffProvisioning__CloudflareDealerGroupId:-}
      StaffProvisioning__BootstrapAdministratorEmail: ${StaffProvisioning__BootstrapAdministratorEmail:-}
      StaffProvisioning__BootstrapAdministratorDisplayName: ${StaffProvisioning__BootstrapAdministratorDisplayName:-WaterFlex Administrator}
      Logging__LogLevel__Default: Information
    volumes:
      - /etc/ssl/certs/aws-rds-global-bundle.pem:/etc/ssl/certs/aws-rds-global-bundle.pem:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  web:
    image: ${WEB_IMAGE:?Set WEB_IMAGE to an ECR repository digest}
    pull_policy: always
    ports:
      - "443:8443"
    volumes:
      - ./web/nginx/staging.conf:/etc/nginx/http.d/default.conf:ro
      - ${WATERFLEX_TLS_CERTIFICATE_PATH:-/etc/waterflex/tls/origin.pem}:/etc/nginx/tls/origin.pem:ro
      - ${WATERFLEX_TLS_PRIVATE_KEY_PATH:-/etc/waterflex/tls/origin.key}:/etc/nginx/tls/origin.key:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    group_add:
      - "0"
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=32m,uid=101,gid=101
      - /var/lib/nginx/tmp:size=32m,uid=101,gid=101
      - /var/run:size=4m,uid=101,gid=101
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:8080/nginx-health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 4
