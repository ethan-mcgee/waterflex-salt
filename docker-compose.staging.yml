services:
  api:
    image: ${ECR_REGISTRY:?Set ECR_REGISTRY}/waterflex-api:${IMAGE_TAG:?Set IMAGE_TAG}
    pull_policy: always
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ConnectionStrings__SaltMonitor: ${ConnectionStrings__SaltMonitor:-}
      Logging__LogLevel__Default: Information
    volumes:
      - /etc/ssl/certs/aws-rds-global-bundle.pem:/etc/ssl/certs/aws-rds-global-bundle.pem:ro
    expose:
      - "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 4

  worker:
    image: ${ECR_REGISTRY:?Set ECR_REGISTRY}/waterflex-worker:${IMAGE_TAG:?Set IMAGE_TAG}
    pull_policy: always
    environment:
      DOTNET_ENVIRONMENT: Staging
      ConnectionStrings__SaltMonitor: ${ConnectionStrings__SaltMonitor:-}
      TelemetryHistory__RawRetentionDays: 30
      TelemetryHistory__HourlyRetentionMonths: 13
      TelemetryHistory__DailyRetentionYears: 3
      TelemetryHistory__DeleteBatchSize: 10000
      TelemetryHistory__MaintenanceIntervalMinutes: 15
      Logging__LogLevel__Default: Information
    volumes:
      - /etc/ssl/certs/aws-rds-global-bundle.pem:/etc/ssl/certs/aws-rds-global-bundle.pem:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: ${ECR_REGISTRY:?Set ECR_REGISTRY}/waterflex-web:${IMAGE_TAG:?Set IMAGE_TAG}
    pull_policy: always
    ports:
      - "443:443"
    volumes:
      - ./web/nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
      - ${WATERFLEX_TLS_CERTIFICATE_PATH:-/etc/waterflex/tls/origin.pem}:/etc/nginx/tls/origin.pem:ro
      - ${WATERFLEX_TLS_PRIVATE_KEY_PATH:-/etc/waterflex/tls/origin.key}:/etc/nginx/tls/origin.key:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 4
