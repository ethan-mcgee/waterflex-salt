name: Factory helper release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: factory-helper-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      firmware_version: ${{ steps.bundle-info.outputs.firmware_version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned build tools
        run: pip install platformio==6.1.19 pyinstaller==6.16.0 esptool==4.11.0 pyserial==3.5
      - name: Build production firmware
        working-directory: firmware
        run: pio run -e arduino_nano_esp32_factory_production
      - name: Create firmware bundle
        working-directory: firmware
        run: python tools/build_factory_bundle.py --output-dir factory-release
      - name: Read bundle info
        id: bundle-info
        shell: pwsh
        run: |
          $manifest = Get-Content firmware/factory-release/factory-bundle.json | ConvertFrom-Json
          "firmware_version=$($manifest.firmwareVersion)" >> $env:GITHUB_OUTPUT
          "configuration_version=$($manifest.configurationVersion)" >> $env:GITHUB_OUTPUT
          "sha256=$($manifest.mergedImage.sha256)" >> $env:GITHUB_OUTPUT
      - name: Validate helper API base URLs
        env:
          STAGING_URL: ${{ vars.FACTORY_HELPER_STAGING_API_URL }}
          PRODUCTION_URL: ${{ vars.FACTORY_HELPER_PRODUCTION_API_URL }}
        shell: pwsh
        run: |
          foreach ($entry in @(
            @{ Name = 'FACTORY_HELPER_STAGING_API_URL'; Value = $env:STAGING_URL },
            @{ Name = 'FACTORY_HELPER_PRODUCTION_API_URL'; Value = $env:PRODUCTION_URL }
          )) {
            if ([string]::IsNullOrWhiteSpace($entry.Value)) {
              throw "Missing repository variable $($entry.Name)."
            }
            $uri = $null
            if (-not [Uri]::TryCreate($entry.Value, [UriKind]::Absolute, [ref]$uri) -or
                $uri.Scheme -ne 'https' -or -not [string]::IsNullOrEmpty($uri.UserInfo)) {
              throw "$($entry.Name) must be an absolute HTTPS URL without embedded credentials."
            }
          }
          $stagingHost = ([Uri]$env:STAGING_URL).DnsSafeHost.ToLowerInvariant()
          if ($stagingHost -in @('console-staging.saltmonitor.dev', 'saltmonitor.dev')) {
            throw 'FACTORY_HELPER_STAGING_API_URL points to a Cloudflare Access-protected console hostname. Use the public telemetry hostname.'
          }
      - uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.AWS_STAGING_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}
      - name: Upload firmware bundle to S3
        env:
          BUCKET: ${{ vars.STAGING_DEPLOY_BUCKET }}
          FIRMWARE_VERSION: ${{ steps.bundle-info.outputs.firmware_version }}
          CONFIGURATION_VERSION: ${{ steps.bundle-info.outputs.configuration_version }}
          SHA256: ${{ steps.bundle-info.outputs.sha256 }}
        shell: bash
        run: |
          [[ -n "$BUCKET" ]] || { echo "Missing repository variable STAGING_DEPLOY_BUCKET." >&2; exit 1; }
          PREFIX="s3://$BUCKET/factory-bundles/$FIRMWARE_VERSION/$CONFIGURATION_VERSION"
          aws s3 cp firmware/factory-release/waterflex-factory.bin "$PREFIX/waterflex-factory.bin" \
            --metadata sha256="$SHA256" --only-show-errors
          aws s3 cp firmware/factory-release/factory-bundle.json "$PREFIX/factory-bundle.json" --only-show-errors
      - name: Verify live staging bundle and presigned image
        env:
          STAGING_URL: ${{ vars.FACTORY_HELPER_STAGING_API_URL }}
        shell: pwsh
        run: |
          $downloadPath = Join-Path $env:RUNNER_TEMP 'waterflex-factory-live.bin'
          try {
            $metadata = Invoke-RestMethod -Method Get -Uri "$($env:STAGING_URL.TrimEnd('/'))/api/v1/factory/bundle" -MaximumRedirection 0 -TimeoutSec 30
            if ($metadata.sha256 -notmatch '^[0-9a-fA-F]{64}$' -or [string]::IsNullOrWhiteSpace($metadata.downloadUrl)) {
              throw 'The live staging bundle response is missing a valid SHA-256 or download URL.'
            }
            Invoke-WebRequest -Method Get -Uri $metadata.downloadUrl -OutFile $downloadPath -MaximumRedirection 5 -TimeoutSec 120
            $actualSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $downloadPath).Hash.ToLowerInvariant()
            if ($actualSha256 -ne $metadata.sha256.ToLowerInvariant()) {
              throw "The live staging bundle checksum did not match: expected $($metadata.sha256), got $actualSha256."
            }
          }
          finally {
            Remove-Item -LiteralPath $downloadPath -Force -ErrorAction SilentlyContinue
          }
      - name: Determine release identity
        id: tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          FIRMWARE_TAG: fw-${{ steps.bundle-info.outputs.firmware_version }}
        run: |
          # A release already exists for this exact firmware version, so this run only rebuilt the
          # helper (no firmware change) — tag by commit instead of reusing/colliding with that release.
          gh release view $env:FIRMWARE_TAG --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            "tag=helper-${{ github.sha }}" >> $env:GITHUB_OUTPUT
          }
          else {
            "tag=$env:FIRMWARE_TAG" >> $env:GITHUB_OUTPUT
          }

          $releaseDate = [DateTime]::UtcNow.ToString('yyyy.MM.dd')
          $titlePrefix = "WaterFlex Factory Helper — $releaseDate."
          $maximumSequence = 0
          $releases = gh release list --repo "${{ github.repository }}" --limit 100 --json name | ConvertFrom-Json
          foreach ($release in $releases) {
            if (-not $release.name.StartsWith($titlePrefix, [StringComparison]::Ordinal)) { continue }
            $sequence = 0
            if ([int]::TryParse($release.name.Substring($titlePrefix.Length), [ref]$sequence) -and
                $sequence -gt $maximumSequence) {
              $maximumSequence = $sequence
            }
          }
          "release_name=$titlePrefix$($maximumSequence + 1)" >> $env:GITHUB_OUTPUT
      - name: Build staging Windows helper
        env:
          API_BASE_URL: ${{ vars.FACTORY_HELPER_STAGING_API_URL }}
        shell: pwsh
        run: |
          "DEFAULT_API_BASE_URL = `"$env:API_BASE_URL`"" | Out-File -Encoding utf8 firmware/tools/_default_config.py
          pyinstaller --onefile --name WaterFlexFactoryHelper-staging --paths firmware/tools --collect-all esptool --collect-all serial firmware/tools/factory_helper.py
      - name: Build production Windows helper
        env:
          API_BASE_URL: ${{ vars.FACTORY_HELPER_PRODUCTION_API_URL }}
        shell: pwsh
        run: |
          "DEFAULT_API_BASE_URL = `"$env:API_BASE_URL`"" | Out-File -Encoding utf8 firmware/tools/_default_config.py
          pyinstaller --onefile --name WaterFlexFactoryHelper-production --paths firmware/tools --collect-all esptool --collect-all serial firmware/tools/factory_helper.py
      - name: Smoke test packaged staging helper
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP 'factory-helper-smoke.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'factory-helper-smoke.stderr.log'
          $helper = Start-Process -FilePath "$pwd/dist/WaterFlexFactoryHelper-staging.exe" -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ready = $false
            for ($attempt = 1; $attempt -le 30; $attempt++) {
              if ($helper.HasExited) {
                throw "The packaged staging helper exited before becoming ready (exit code $($helper.ExitCode))."
              }
              try {
                $health = Invoke-RestMethod -Method Get -Uri 'http://127.0.0.1:8765/v1/health' -Headers @{ Origin = 'https://console-staging.saltmonitor.dev' } -TimeoutSec 2
                if ($health.status -eq 'ready' -and $health.protocolVersion -eq '2') {
                  $devices = Invoke-RestMethod -Method Get -Uri 'http://127.0.0.1:8765/v1/devices' -Headers @{ Origin = 'https://console-staging.saltmonitor.dev' } -TimeoutSec 2
                  if ($devices.status -notin @('none', 'detected', 'multiple') -or $null -eq $devices.devices) {
                    throw 'The packaged helper returned an invalid device-detection response.'
                  }
                  $ready = $true
                  break
                }
              }
              catch {
                # PyInstaller extraction and the first approved-bundle download can take a few seconds.
              }
              Start-Sleep -Seconds 2
            }
            if (-not $ready) {
              throw 'The packaged staging helper did not report ready within 60 seconds.'
            }
          }
          finally {
            if (-not $helper.HasExited) {
              Stop-Process -Id $helper.Id -Force
              $helper.WaitForExit()
            }
            if (Test-Path -LiteralPath $stdout) { Get-Content -LiteralPath $stdout }
            if (Test-Path -LiteralPath $stderr) { Get-Content -LiteralPath $stderr }
          }
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231 # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.release_name }}
          body_path: firmware/tools/FACTORY_HELPER_README.md
          fail_on_unmatched_files: true
          files: |
            dist/WaterFlexFactoryHelper-staging.exe
            dist/WaterFlexFactoryHelper-production.exe
