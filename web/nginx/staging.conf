map $http_cf_connecting_ip $waterflex_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

ssl_certificate /etc/nginx/tls/origin.pem;
ssl_certificate_key /etc/nginx/tls/origin.key;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:WaterFlexTLS:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

upstream waterflex_api {
    server api:8080;
    keepalive 16;
}

server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;

    # Container-local liveness endpoint for Docker health checks.
    location = /nginx-health {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Docker uses the container-only HTTP listener for health checks. Port 8080
    # is intentionally not published by the staging Compose file.
    location = /health {
        proxy_pass http://waterflex_api/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location = /health/ready {
        proxy_pass http://waterflex_api/health/ready;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl default_server;
    server_name _;
    server_tokens off;
    return 444;
}

server {
    listen 8443 ssl;
    server_name console-staging.saltmonitor.dev saltmonitor.dev;
    server_tokens off;

    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://127.0.0.1:8765; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), serial=(self)" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://waterflex_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $waterflex_client_ip;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $waterflex_client_ip;
    }

    location = /health {
        proxy_pass http://waterflex_api/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $waterflex_client_ip;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $waterflex_client_ip;
    }

    location = /health/ready {
        proxy_pass http://waterflex_api/health/ready;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $waterflex_client_ip;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $waterflex_client_ip;
    }

    # Vite fingerprints these filenames per build, so a cached copy can never go stale.
    location /assets/ {
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://127.0.0.1:8765; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), serial=(self)" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html must always be revalidated: it references the current build's
    # fingerprinted assets, so a stale cached copy on a phone can keep loading an old,
    # possibly broken bundle no matter how many times "Try again" reloads the page.
    location / {
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://127.0.0.1:8765; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), serial=(self)" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 8443 ssl;
    server_name telemetry-staging.saltmonitor.dev telemetry.saltmonitor.dev;
    server_tokens off;
    client_max_body_size 64k;

    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /health {
        limit_except GET { deny all; }
        proxy_pass http://waterflex_api/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $waterflex_client_ip;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $waterflex_client_ip;
    }


    location = /health/ready {
        limit_except GET { deny all; }
        proxy_pass http://waterflex_api/health/ready;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $waterflex_client_ip;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $waterflex_client_ip;
    }

    location = /api/v1/device/telemetry {
        limit_except POST { deny all; }
        proxy_pass http://waterflex_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $waterflex_client_ip;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $waterflex_client_ip;
    }

    location = /api/v1/device/health {
        limit_except POST { deny all; }
        proxy_pass http://waterflex_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $waterflex_client_ip;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $waterflex_client_ip;
    }

    location = /api/v1/device/activate {
        limit_except POST { deny all; }
        proxy_pass http://waterflex_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $waterflex_client_ip;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $waterflex_client_ip;
    }

    # The workstation helper has no Cloudflare Access session. Expose only its
    # two machine-facing factory endpoints on the otherwise narrow telemetry
    # hostname; staff factory routes remain covered by the 404 catch-all below.
    location = /api/v1/factory/bundle {
        limit_except GET { deny all; }
        proxy_pass http://waterflex_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $waterflex_client_ip;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $waterflex_client_ip;
    }

    location = /api/v1/factory/flash-authorizations/verify {
        limit_except POST { deny all; }
        proxy_pass http://waterflex_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $waterflex_client_ip;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $waterflex_client_ip;
    }

    location = /api/v1/factory/verifications {
        limit_except POST { deny all; }
        proxy_pass http://waterflex_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $waterflex_client_ip;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $waterflex_client_ip;
    }

    location / {
        return 404;
    }
}
