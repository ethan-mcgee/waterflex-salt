services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: waterflex-api:local
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__SaltMonitor: Host=postgres;Port=5432;Database=saltmonitor;Username=saltmonitor;Password=saltmonitor
      Logging__LogLevel__Default: Information
    ports:
      - "5188:8080"
    depends_on:
      - postgres

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: waterflex-web:local
    ports:
      - "3000:8080"
    depends_on:
      - api

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.worker
    image: waterflex-worker:local
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__SaltMonitor: Host=postgres;Port=5432;Database=saltmonitor;Username=saltmonitor;Password=saltmonitor
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: saltmonitor
      POSTGRES_USER: saltmonitor
      POSTGRES_PASSWORD: saltmonitor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
